<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn - MoneyCore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <div class="logo">Money<span>Core</span></div>
        <div>
            <a href="index.html">Home</a>
            <a href="earn.html" style="color: var(--primary);">Earn</a>
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>

    <section class="container">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Offerwall</h2>
        <p style="text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 0.5rem;">You keep 60% of every survey payout!</p>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Complete surveys below to increase your balance.</p>
        
        <div class="card" id="offerwallContainer" style="text-align: center; padding: 5rem 1rem; border: 2px dashed #334155;">
            <h3 id="loadingText">Loading Offerwall...</h3>
            <p class="text-muted" id="statusText"></p>
        </div>
    </section>

    <script src="js/supabase.js"></script>
    <script>
        async function loadOfferwall() {
            const { data: { user } } = await _supabase.auth.getUser();
            
            if (!user) {
                document.getElementById('loadingText').innerText = "Please login to see offers";
                document.getElementById('loadingText').style.color = "#ef4444";
                document.getElementById('statusText').innerHTML = "<a href='login.html' style='color:var(--primary);'>Click here to Login</a>";
                return;
            }

            const container = document.getElementById('offerwallContainer');
            container.innerHTML = `
                <h3 style="color:var(--primary); margin-bottom:1rem;">CPX Research Surveys</h3>
                <p class="text-muted" style="margin-bottom:1rem;">Your User ID: ${user.id}</p>
                <div style="padding: 2rem; background: rgba(16, 185, 129, 0.1); border-radius: 8px;">
                    <p><b>Waiting for CPX Approval...</b></p>
                    <p style="font-size:0.8rem; margin-top:0.5rem;">Once approved, the actual surveys will appear here. Your earnings will be automatically calculated.</p>
                </div>
            `;
            document.getElementById('loadingText').style.display = 'none';
        }
        loadOfferwall();
    </script>
</body>
</html>
