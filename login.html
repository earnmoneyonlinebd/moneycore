<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MoneyCore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <div class="logo">Money<span>Core</span></div>
        <div><a href="index.html">Home</a></div>
    </nav>

    <section class="container" style="max-width: 450px; margin-top: 5rem; margin-bottom: 5rem;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" class="input-field" placeholder="example@email.com" required>
                </div>

                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label style="margin: 0;">Password</label>
                        <a href="#" style="color: var(--primary); font-size: 0.8rem; text-decoration: none;">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    
                    <!-- SVG Eye Icon -->
                    <span class="eye-icon" onclick="togglePassword('password', this)">
                        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>

                <button type="submit" id="loginBtn" class="btn" style="width:100%; margin-top: 1rem;">Login</button>
            </form>
            
            <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
                Don't have an account? <a href="signup.html" style="color:var(--primary);">Sign Up</a>
            </p>
            <p id="msg" style="text-align:center; margin-top:1rem; font-weight:bold;"></p>
        </div>
    </section>

    <script src="js/supabase.js"></script>
    <script>
        // SVG Paths
        const svgEyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const svgEyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(inputId, iconContainer) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconContainer.innerHTML = svgEyeClosed;
            } else {
                input.type = "password";
                iconContainer.innerHTML = svgEyeOpen;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('loginBtn');

            msg.innerText = "Logging in...";
            msg.style.color = "white";
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msg.innerText = error.message;
                msg.style.color = "#ef4444";
                btn.disabled = false;
            } else {
                msg.innerText = "Login successful! Redirecting...";
                msg.style.color = "var(--primary)";
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            }
        });
    </script>
</body>
</html>
